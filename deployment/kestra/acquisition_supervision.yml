id: acquisition_supervision
namespace: weow.operations
description: Keep Acquisition running after controlled launch and make interventions visible.

tasks:
  - id: ensure_running
    type: io.kestra.plugin.fs.ssh.Command
    host: 192.168.1.135
    port: "22"
    username: codexuser
    authMethod: PUBLIC_KEY
    privateKey: "{{ secret('WEOW_A_SSH_PRIVATE_KEY') }}"
    commands:
      - systemctl --user is-active --quiet weow-acquisition.service || systemctl --user restart weow-acquisition.service
      - systemctl --user is-active weow-acquisition.service
    retry:
      type: constant
      interval: PT30S
      maxAttempts: 2
    timeout: PT2M

triggers:
  - id: every_minute
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "* * * * *"
    allowConcurrent: false
    recoverMissedSchedules: NONE
    disabled: true
