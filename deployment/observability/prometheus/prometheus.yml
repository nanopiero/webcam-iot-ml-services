global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: acquisition
    static_configs:
      - targets: ["192.168.1.135:9101"]
        labels:
          host: weow-a

  - job_name: kestra
    metrics_path: /prometheus
    static_configs:
      - targets: ["kestra:8081"]

  - job_name: nodes
    static_configs:
      - targets:
          - "192.168.1.135:9100"
          - "192.168.1.145:9100"
          - "192.168.1.6:9100"
          - "192.168.1.83:9100"
